<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Hx logo">
  <title>Hx</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4338ca"/>
      <stop offset="1" stop-color="#0e7490"/>
    </linearGradient>
  </defs>
  <!-- tile -->
  <rect x="8" y="8" width="184" height="184" rx="44" fill="url(#bg)"/>
  <!-- the H's posts: the board's "ready" and "done" columns -->
  <rect x="44" y="42" width="24" height="116" rx="12" fill="#fff"/>
  <rect x="132" y="42" width="24" height="116" rx="12" fill="#fff"/>
  <!-- its crossbar: three worker lanes between them -->
  <g stroke="#fff" stroke-opacity=".45" stroke-width="6" stroke-linecap="round">
    <line x1="68" y1="72" x2="132" y2="72"/>
    <line x1="68" y1="100" x2="132" y2="100"/>
    <line x1="68" y1="128" x2="132" y2="128"/>
  </g>
  <!-- issues on their way across -->
  <g fill="#fbbf24">
    <circle cx="86" cy="72" r="9"/>
    <circle cx="116" cy="100" r="9"/>
    <circle cx="98" cy="128" r="9"/>
  </g>
</svg>
